; Private local Linux export only. Use tools/export_linux.py, not the checkout cache.
[preset.0]
name="Linux private"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/stackcraft.json,assets/imported/manifest.json,assets/imported/fonts/*"
exclude_filter="tests/*,tools/*,docs/*,source/*,third_party/*,.github/*,data/manifest.json"
export_path=""
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
